name: Update dashboard feed
on:
  schedule:
    - cron: '15 21 * * 1-5'   # GitHub often delays scheduled runs by hours,
    - cron: '45 21 * * 1-5'   # so run several times after the US close
    - cron: '30 22 * * 1-5'
    - cron: '30 23 * * 1-5'
    - cron: '30 1 * * 2-6'
    - cron: '0 12 * * 1-5'    # morning run for overnight news and filings
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/update.mjs
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
      - run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/feed.json
          git diff --staged --quiet || git commit -m "Update feed $(date -u +%F)"
          git push
